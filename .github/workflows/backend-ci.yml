name: Backend CI

# Runs on every push and pull request that touches the backend.
# The "paths" filter means Android-only commits do not burn CI minutes here.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # Caches the Gradle distribution and dependencies between runs,
      # turning a ~3 minute build into roughly 40 seconds.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The GitHub runner has a Docker daemon, which is what lets
      # Testcontainers start a real PostgreSQL for the integration tests.
      - name: Build and test
        working-directory: backend
        run: ./gradlew build --no-daemon

      # "if: always()" so you still get the report when tests FAIL --
      # that is exactly when you need to read it.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore
